<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call of Cthulhu</title>
    <link rel="stylesheet" href="../styles/inimigos-style.css">
    <link rel="shortcut icon" href="/images/caveira-e-ossos-red.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        <div class="logo-comp">
            <div class="logo"><img src="../images/caveira-e-ossos-red.png" alt=""></div>
            <div>
                <h1>Call of Cthulhu</h1>
                <h4>Caio & Mateus</h4>
            </div>
        </div>
        <div class="buttons-switch">
            <button class="header-inactive" onclick="window.location.href='../index.html'"><i
                    class="fa-solid fa-user-plus"></i>Investigadores</button>
            <button class="selected"><i class="fa-solid fa-skull-crossbones"></i>Inimigos & Criaturas</button>
        </div>
    </header>

    <div class="background-add" id="modal" onclick="fecharForm()">
        <div class="add" onclick="event.stopPropagation()">
            <h1><i class="fa-solid fa-book"></i> Nova Criatura</h1>
            <hr>
            <form action="post">
                <div class="box">
                    <label>Nome</label>
                    <input type="text" name="name" style="text-align: left;" id="iName"
                        placeholder="Digite o nome da criatura..." autocomplete="off">
                </div>
                <br>
                <div class="ocupação-box">
                    <label>Tipo</label>
                    <input style="text-align: left;" type="text" id="iocup"
                        placeholder="Ex: Fantasma, Demônio, Troll, Zumbi...">
                </div>
                <br>
                <h2>Características</h2>
                <hr>
                <div class="grid-caracs">
                    <div class="carac-box">
                        <label>Força (STR)</label>
                        <input type="number" id="iFor" value="50">
                    </div>
                    <div class="carac-box">
                        <label>Constituição (CON)</label>
                        <input type="number" id="iConst" value="50">
                    </div>
                    <div class="carac-box">
                        <label>Tamanho (SIZ)</label>
                        <input type="number" id="iTam" value="50">
                    </div>
                    <div class="carac-box">
                        <label>Destreza (DEX)</label>
                        <input type="number" id="iDes" value="50">
                    </div>
                    <div class="carac-box">
                        <label>Inteligência (INT)</label>
                        <input type="number" id="iTen" value="50">
                    </div>
                    <div class="carac-box">
                        <label>Poder (POW)</label>
                        <input type="number" id="iPower" value="50">
                    </div>
                </div>
                <br>
                <h2>Pontos Derivados</h2>
                <hr>
                <div class="grid-points">
                    <div class="points-box">
                        <label>PV Atual</label>
                        <input type="number" id="iPvAt" value="10">
                    </div>
                    <div class="points-box">
                        <label>PV Máximo</label>
                        <input type="number" id="iPvMax" value="10">
                    </div>
                    <div class="points-box">
                        <label>Armadura</label>
                        <input type="number" id="iArmadura" value="0">
                    </div>
                    <div class="points-box">
                        <label>Perda de SAN</label>
                        <input type="text" id="iSanLoss" placeholder="Ex: 1/1D6">
                    </div>
                </div>
                <br>
                <hr>
                <div class="div-botão-pai">
                    <h2>Armas</h2>
                    <button class="btn-adicionar" type="button" onclick="adicionarArmamento()">+ Adicionar Armamento</button>
                </div>
                <div id="lista-armamentos"></div>
                <hr>
                <div class="div-botão-filho">
                    <h2>Habilidades</h2>
                    <button class="btn-adicionar" type="button" onclick="adicionarItem()">+ Adicionar Habilidade</button>
                </div>
                <div id="lista-itens"></div>
                <hr>
                <div class="hist-box">
                    <h2>Descrição</h2>
                    <textarea name="hist" id="ihist" placeholder="Descreva a criatura e suas habilidades especiais..."></textarea>
                </div>
                <br>
                <div class="btn-group">
                    <button type="button" class="selected btn-criar" style="width: 600px;" onclick="criarPersonagem()">Criar Monstro</button>
                    <br>
                    <button type="button" class="selected" onclick="fecharForm()"
                        style="background-color: #1b2129; color: gray;">Voltar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="body-mod">
        <div class="description">
            <div class="desc-inv">
                <h1>Inimigos & Criaturas</h1>
                <h4>Gerencie os horrores que espreitam nas sombras</h4>
            </div>
            <div class="button-add"><button class="selected" onclick="abrirForm()"><i class="fa-solid fa-skull"></i>
                    Nova Criatura</button></div>
        </div>

        <div class="grid" id="grid"></div>
    </div>

    <script src="../scripts/scriptInimigo.js"></script>
</body>

</html>
