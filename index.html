<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call of Cthulhu</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="shortcut icon" href="/images/caveira-e-ossos.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="background-add" id="modal" onclick="fecharForm()">
        <div class="add" onclick="event.stopPropagation()">
            <h1><i class="fa-solid fa-book"></i> Novo Investigador</h1>
            <hr>
            <form action="post">
                <div class="box">
                    <label>Nome</label>
                    <input type="text" name="name" style="text-align: left;" id="iName" placeholder="Digite o nome do personagem..."
                        autocomplete="off">
                </div>
                <br>
                <div class="box">
                    <label>Idade</label>
                    <input style="text-align: left;" type="number" value="18" id="iDade">
                </div>
                <br>
                <div class="ocupação-box">
                    <label>Ocupação</label>
                    <input style="text-align: left;" type="text" id="iocup" placeholder="Ex: Detetive, Professor, Médico, Jornalista...">
                </div>
                <br>
                <h2>Características</h2>
                <hr>
                <div class="grid-caracs">
                    <div class="carac-box">
                        <label>Força (STR)</label>
                        <input type="number" id="iFor" value="50">
                    </div>
                    <div class="carac-box">
                        <label>Constituição (CON)</label>
                        <input type="number" id="iConst" value="50">
                    </div>
                    <div class="carac-box">
                        <label>Tamanho (SIZ)</label>
                        <input type="number" id="iTam" value="50">
                    </div>
                    <div class="carac-box">
                        <label>Destreza (DEX)</label>
                        <input type="number" id="iDes" value="50">
                    </div>
                    <div class="carac-box">
                        <label>Aparência (APP)</label>
                        <input type="number" id="iApar" value="50">
                    </div>
                    <div class="carac-box">
                        <label>Inteligência (INT)</label>
                        <input type="number" id="iTen" value="50">
                    </div>
                    <div class="carac-box">
                        <label>Poder (POW)</label>
                        <input type="number" id="iPower" value="50">
                    </div>
                    <div class="carac-box">
                        <label>Educação (EDU)</label>
                        <input type="number" id="iEduc" value="50">
                    </div>
                </div>
                <br>
                <h2>Pontos Derivados</h2>
                <hr>
                <div class="grid-points">
                    <div class="points-box">
                        <label>Sanidade Atual</label>
                        <input type="number" id="iSanAt" value="50">
                    </div>
                    <div class="points-box">
                        <label>Sanidade Máxima</label>
                        <input type="number" id="iSanMax" value="50">
                    </div>
                    <div class="points-box">
                        <label>PV Atual</label>
                        <input type="number" id="iPvAt" value="10">
                    </div>
                    <div class="points-box">
                        <label>PV Máximo</label>
                        <input type="number" id="iPvMax" value="10">
                    </div>
                    <div class="points-box">
                        <label>PM Atual</label>
                        <input type="number" id="iPmAt" value="10">
                    </div>
                    <div class="points-box">
                        <label>PM Máximo</label>
                        <input type="number" id="iPmMax" value="10">
                    </div>
                </div>
                <br>
                <hr>
                <div class="div-botão-pai">
                    <h2>Armas</h2>
                    <button class="btn-adicionar" type="button" onclick="adicionarArmamento()">+ Adicionar Armamento</button>
                </div>
                <div id="lista-armamentos"></div>
                <hr>
                <div class="div-botão-mãe">
                    <h2>Inventário</h2>
                    <button class="btn-adicionar" type="button" onclick="adicionarItem()">+ Adicionar Item</button>
                </div>
                <div id="lista-itens"></div>
                <hr>
                <div class="hist-box">
                    <h2>História (opcional)</h2>
                    <textarea name="hist" id="ihist" placeholder="Conte a História do investigador..."></textarea>
                </div>
                <br>
                <div class="btn-group">
                    <button type="button" class="selected btn-criar" style="width: 600px;" onclick="criarPersonagem()">Criar Personagem</button>
                    <br>
                    <button type="button" class="selected" onclick="fecharForm()"
                        style="background-color: #3a3a3a;">Voltar</button>
                </div>
            </form>
        </div>
    </div>
    <header>
        <div class="logo-comp">
            <div class="logo"><img src="./images/caveira-e-ossos.png" alt=""></div>
            <div>
                <h1>Call of Cthulhu</h1>
                <h4>Caio & Mateus</h4>
            </div>
        </div>
        <div class="buttons-switch">
            <button class="selected"><i class="fa-solid fa-user-plus"></i>Investigadores</button>
            <button onclick="window.location.href='./pages/Inimigo.html'" class="header-inactive"><i
                    class="fa-solid fa-skull-crossbones"></i>Inimigos & Criaturas</button>
        </div>
    </header>
    <div class="body-mod">
        <div class="description">
            <div class="desc-inv">
                <h1>Investigadores</h1>
                <h4>Gerencie os corajosos que enfrentam o desconhecido</h4>
            </div>
            <div class="button-add"><button class="selected" onclick="abrirForm()"><i class="fa-solid fa-book-open"></i>
                    Novo Investigador</button></div>
        </div>

        <div class="grid" id="grid">
        </div>
    </div>
</body>
<script src="./scripts/script.js"></script>

</html>
