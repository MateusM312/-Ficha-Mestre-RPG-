<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call of Cthulhu</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="shortcut icon" href="/images/caveira-e-ossos.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="background-add" id="modal" onclick="fecharForm()">
        <div class="add" onclick="event.stopPropagation()">
            <h1><i class="fa-solid fa-book"></i> Novo Investigador</h1>
            <hr>
            <form action="post">
                <div class="box">
                    <label>Nome</label> <br>
                    <input type="text" name="name" id="iname">
                </div>
                <br>
                <div class="box">
                    <label>Idade</label> <br>
                    <input type="number" value="18">
                </div>
                <br>
                <div class="ocupação-box">
                    <label>Ocupação</label> <br>
                    <input type="text" placeholder="Ex: Detetive, Professor, Médico, Jornalista...">
                </div>
                <br>
                <h2>Características</h2>
                <hr>

                <button type="button" class="selected">Criar Personagem</button>
                <br>
                <button type="button" class="selected" onclick="fecharForm()">Voltar</button>
            </form>
        </div>
    </div>
    <header>
        <div class="logo-comp">
            <div class="logo"><img src="./images/caveira-e-ossos.png" alt=""></div>
            <div>
                <h1>Call of Cthulhu</h1>
                <h4>Keeper's Compedium</h4>
            </div>
        </div>
        <div class="buttons-switch">
            <button class="selected"><i class="fa-solid fa-user-plus"></i>Investigadores</button>
            <button onclick="window.location.href='./pages/Inimigo.html'" class="header-inactive"><i
                    class="fa-solid fa-skull-crossbones"></i></i>Inimigos & Criaturas</button>
        </div>
    </header>
    <div class="body-mod">
        <div class="description">
            <div class="desc-inv">
                <h1>Investigadores</h1>
                <h4>Gerencie os corajosos que enfrentam o desconhecido</h4>
            </div>
            <div class="button-add"><button class="selected"
                    onclick="abrirForm()"><i
                        class="fa-solid fa-book-open"></i> Novo Investigador</button></div>
        </div>

        <div class="grid">
            <div class="card">
                <h1>Dr. Thomas Blackwood</h1>
                <p>Professor de Arqueologia - <label>45 Anos</label></p>
                
                <div><i class="fa-regular fa-heart"></i><div class="background-bar"><div class="up-background-bar"></div></div> <p>13/13</p></div>
                <div><i class="fa-solid fa-brain"></i><div class="background-bar"><div class="up-background-bar"></div></div> <p>58/56</p></div>
                <div><i class="fa-solid fa-bolt"></i><div class="background-bar"><div class="up-background-bar"></div></div> <p>13/13</p></div>
                
                <hr>

                <div>
                    <div class="stats"><p>FOR</p><div class="stats-number">60</div></div>
                    <div class="stats"><p>DES</p><div class="stats-number">55</div></div>
                    <div class="stats"><p>INT</p><div class="stats-number">80</div></div>
                    <div class="stats"><p>POW</p><div class="stats-number">65</div></div>
                </div>
                
                <hr>

                <p>Armamento</p>
                <p>Revólver .38</p>
            </div>
        </div>
    </div>
</body>
<script src="./scripts/script.js"></script>
</html>
