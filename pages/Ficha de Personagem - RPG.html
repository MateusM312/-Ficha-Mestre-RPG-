<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ficha de Persongagem - RPG</title>
  </head>

  <body>
    <div>
      <header>
        <h1>Ficha de Personagem</h1>
      </header>

      <form action="post" autocomplete="off">
        <div>
          <fieldset>
            <legend>Identidade</legend>

            <label for="nomeperso">Nome do Personagem</label>
            <input type="text" name="nomeperso" id="inomeperso" />

            <br />

            <label for="nomeplayer">Nome do Jogador</label>
            <input type="text" name="nomeplayer" id="inomeplayer" />

            <label for="Raça">Raça</label>
            <select name="raça" id="iraça">
              <option value="">Humano</option>
              <option value="">Elfo</option>
              <option value="">Anão</option>
            </select>

            <label for="Classe">Classe</label>
            <select name="classe" id="iclasse">
              <option value="">Guerreiro</option>
              <option value="">Mago</option>
              <option value="">Ladino</option>
              <option value="">Clérigo</option>
            </select>

            <label for="Antecedente">Antecedente</label>
            <select name="antecedente" id="iantecedente">
              <option value="">Soldado</option>
              <option value="">Nobre</option>
              <option value="">Eremita</option>
              <option value="">Criminoso</option>
              <option value="">Plebeu</option>
            </select>
          </fieldset>
        </div>

        <fieldset>
          <legend>Atributos</legend>

          <div class="atri-box">
            <label>FORÇA</label>
            <input type="number" value="16" />
          </div>

          <div class="atri-box">
            <label>DESTREZA</label>
            <input type="number" value="15" />
          </div>

          <div class="atri-box">
            <label>CONSTITUIÇÃO</label>
            <input type="number" value="17" />
          </div>

          <div class="atri-box">
            <label>INTELIGÊNCIA</label>
            <input type="number" value="11" />
          </div>

          <div class="atri-box">
            <label>SABEDORIA</label>
            <input type="number" value="12" />
          </div>

          <div class="atri-box">
            <label>CARISMA</label>
            <input type="number" value="18" />
          </div>
        </fieldset>

        <div>
          <fieldset>
            <legend>Status de Combate</legend>

            <div class="status-box">
              <label>PV Máximo</label>
              <input type="number" value="0" placeholder="Ex:52" />
            </div>

            <div class="status-box">
              <label>PV Atual</label>
              <input type="number" value="0" placeholder="Ex:37" />
            </div>

            <div class="satus-box">
              <label>Pontos de Armadura</label>
              <input type="number" value="0" placeholder="Ex:17" />
            </div>
          </fieldset>
        </div>

        <fieldset>
          <legend>Pericias</legend>

          <input type="checkbox" />
          <label>Atletismo</label>

          <input type="checkbox" />
          <label>Furtividade</label>

          <input type="checkbox" />
          <label>Percepção</label>

          <input type="checkbox" />
          <label>Persuasão</label>

          <input type="checkbox" />
          <label>Arcano</label>

          <input type="checkbox" />
          <label>Intimidação</label>

          <input type="checkbox" />
          <label>Religião</label>

          <input type="checkbox" />
          <label>História</label>
        </fieldset>

        <div>
          <fieldset>
            <legend>Equipamentos e Inventário</legend>

            <label for="Armaprinci">Arma Principal</label>
            <input type="text" name="armaprinci" id="iarmaprinci" />

            <label for="Itens&Equip">Itens e Equipamentos</label>
            <textarea
              name="itens&equip"
              id="iItens&equip"
              placeholder="Digite os seus itens e equipamentos iniciais"
            ></textarea>

            <div class="money-box">
              <label>Ouro</label>
              <input type="number" value="0" />
            </div>

            <div class="money-box">
              <label>Prata</label>
              <input type="number" value="0" />
            </div>

            <div class="money-box">
              <label>Cobre</label>
              <input type="number" value="0" />
            </div>
          </fieldset>
        </div>

        <div>
          <fieldset>
            <legend>Traços & História</legend>

            <div class="hist-box">
              <label for="Perso">Traços de Personalidade</label>
              <textarea
                name="perso"
                id="iperso"
                placeholder="Como seu personagem age e fala..."
              ></textarea>
            </div>

            <div class="hist-box">
              <label for="valores">Valores</label>
              <textarea
                name="valores"
                id="ivalores"
                placeholder="O que seu personagem valoriza..."
              ></textarea>
            </div>

            <div class="hist-box">
              <label for="Vinc">Vinculo</label>
              <textarea
                name="vinc"
                id="ivinc"
                placeholder="Quem ou o que seu persongem protege..."
              ></textarea>
            </div>

            <div class="hist-box">
              <label for="Fraq">Fraqueza</label>
              <textarea
                name="fraq"
                id="ifraq"
                placeholder="O que pode comprometer seu personagem..."
              ></textarea>
            </div>
          </fieldset>
        </div>

        <div>
          <label for="fotoperso">Foto do Personagem</label>
          <input
            type="file"
            name="foto"
            id="ifoto"
            placeholder="Como o seu personagem se parece (opcional)"
            accept="image/*"
          />
        </div>

        <button type="button">Gerar PDF</button>
      </form>
    </div>
  </body>
</html>
